name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run unit tests
        run: npm test

      - name: Build production bundle
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: "ci-placeholder-key"
          VITE_FIREBASE_AUTH_DOMAIN: "ci-placeholder.firebaseapp.com"
          VITE_FIREBASE_PROJECT_ID: "ci-placeholder"
          VITE_FIREBASE_STORAGE_BUCKET: "ci-placeholder.appspot.com"
          VITE_FIREBASE_APP_ID: "1:000000:web:000000"
          VITE_PAYSTACK_PUBLIC_KEY: "pk_test_placeholder"
          VITE_WHATSAPP_NUMBER: "2349046453977"
