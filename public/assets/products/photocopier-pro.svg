<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none">
  <defs>
    <radialGradient id="g-copier" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#05070D" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="body-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="#080C16"/>
  <circle cx="400" cy="280" r="280" fill="url(#g-copier)"/>
  <!-- ADF Top Feeder -->
  <rect x="240" y="95" width="320" height="45" rx="10" fill="#334155" stroke="#38BDF8" stroke-width="2"/>
  <rect x="270" y="80" width="200" height="18" rx="4" fill="#1E293B" stroke="#94A3B8" stroke-width="1.5"/>
  <!-- Main Copier Body -->
  <rect x="210" y="140" width="380" height="360" rx="16" fill="url(#body-grad)" stroke="#475569" stroke-width="2.5"/>
  <!-- Touchscreen Control Panel -->
  <rect x="470" y="160" width="95" height="54" rx="8" fill="#0F172A" stroke="#38BDF8" stroke-width="2"/>
  <rect x="480" y="170" width="55" height="34" rx="4" fill="#2563FF" fill-opacity="0.5"/>
  <circle cx="550" cy="187" r="6" fill="#10B981"/>
  <!-- Output Cavity -->
  <rect x="245" y="225" width="310" height="65" rx="8" fill="#05070D" stroke="#334155" stroke-width="2"/>
  <rect x="280" y="255" width="160" height="14" rx="2" fill="#F8FAFC"/>
  <!-- Cassette Trays 1, 2, 3 -->
  <rect x="240" y="310" width="320" height="50" rx="6" fill="#0F172A" stroke="#334155" stroke-width="2"/>
  <rect x="370" y="328" width="60" height="14" rx="4" fill="#38BDF8" fill-opacity="0.3"/>
  <rect x="240" y="372" width="320" height="50" rx="6" fill="#0F172A" stroke="#334155" stroke-width="2"/>
  <rect x="370" y="390" width="60" height="14" rx="4" fill="#38BDF8" fill-opacity="0.3"/>
  <rect x="240" y="434" width="320" height="50" rx="6" fill="#0F172A" stroke="#334155" stroke-width="2"/>
  <rect x="370" y="452" width="60" height="14" rx="4" fill="#F5B93A" fill-opacity="0.4"/>
</svg>
