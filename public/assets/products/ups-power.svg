<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none">
  <defs>
    <radialGradient id="g-ups" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#F5B93A" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#05070D" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="600" fill="#080C16"/>
  <circle cx="400" cy="290" r="260" fill="url(#g-ups)"/>
  <!-- Primary Tower UPS -->
  <rect x="270" y="120" width="260" height="370" rx="18" fill="#0F172A" stroke="#475569" stroke-width="3"/>
  <rect x="295" y="145" width="210" height="320" rx="12" fill="#090D16" stroke="#1E293B" stroke-width="2"/>
  <!-- Digital Telemetry LCD Screen -->
  <rect x="330" y="175" width="140" height="90" rx="10" fill="#051329" stroke="#38BDF8" stroke-width="2"/>
  <text x="400" y="218" text-anchor="middle" fill="#38BDF8" font-family="sans-serif" font-weight="700" font-size="26">230V AC</text>
  <text x="400" y="245" text-anchor="middle" fill="#F5B93A" font-family="sans-serif" font-weight="600" font-size="13">100% BATT · PURE SINE</text>
  <!-- Power Button -->
  <circle cx="400" cy="310" r="20" fill="#1E293B" stroke="#F5B93A" stroke-width="2.5"/>
  <circle cx="400" cy="310" r="7" fill="#F5B93A"/>
  <!-- Ventilation Louvers -->
  <line x1="330" y1="365" x2="470" y2="365" stroke="#334155" stroke-width="5" stroke-linecap="round"/>
  <line x1="330" y1="385" x2="470" y2="385" stroke="#334155" stroke-width="5" stroke-linecap="round"/>
  <line x1="330" y1="405" x2="470" y2="405" stroke="#334155" stroke-linecap="round" stroke-width="5"/>
  <line x1="330" y1="425" x2="470" y2="425" stroke="#334155" stroke-linecap="round" stroke-width="5"/>
</svg>
